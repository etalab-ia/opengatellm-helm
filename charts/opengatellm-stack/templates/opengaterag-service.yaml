{{- if .Values.opengaterag.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-opengaterag
  labels:
    {{- include "opengatellm-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: opengaterag
spec:
  type: {{ .Values.opengaterag.service.type }}
  ports:
    - port: {{ .Values.opengaterag.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-opengaterag
{{- end }}
