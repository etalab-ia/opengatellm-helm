{{- if .Values.opengaterag.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opengaterag-config
  labels:
    {{- include "opengatellm-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: opengaterag
data:
  config.yml: |
    dependencies:
      opengatellm:
        url: ${OPENGATELLM_URL}
        model_name: ${OPENGATELLM_MODEL_NAME}
        model_vector_size: ${OPENGATELLM_MODEL_VECTOR_SIZE}
      postgres:
        url: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/api
      elasticsearch:
        index_name: {{ .Values.opengaterag.config.elasticsearch.index_name | quote }}
        index_language: {{ .Values.opengaterag.config.elasticsearch.index_language | quote }}
        number_of_shards: {{ .Values.opengaterag.config.elasticsearch.number_of_shards }}
        number_of_replicas: {{ .Values.opengaterag.config.elasticsearch.number_of_replicas }}
        refresh_interval: {{ .Values.opengaterag.config.elasticsearch.refresh_interval | quote }}
        hosts: http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}

    settings:
      swagger_version: {{ .Values.opengaterag.image.tag | quote }}
      log_level: INFO
{{- end }}
